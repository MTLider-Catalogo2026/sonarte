<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SonArte · Botonera de sonidos</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0b0d14; --panel:#141824; --card:#1b2030; --line:#2a3146; --tx:#eef1f8; --tx2:#9aa3bd;
    --acento:#ff7a59; --acento2:#2dd4bf; --ok:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top));}
  header .logo{font-weight:800;font-size:17px;letter-spacing:.02em;}
  header .logo b{color:var(--acento);}
  header .sp{flex:1;}
  .vol{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px;}
  .vol input{width:90px;}
  button.hbtn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;}
  button.hbtn.stop{background:#3a1620;border-color:#5b2230;color:#ffb4b4;}
  button.hbtn.edit.on{background:var(--acento);border-color:var(--acento);color:#201008;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  .tab{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;}
  .tab.on{background:var(--acento2);border-color:var(--acento2);color:#05201c;}
  .tab.add{color:var(--acento2);}
  .edbar{display:none;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  .edbar button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;
    padding:9px;font-size:13px;font-weight:600;cursor:pointer;}
  .barbusca{padding:10px 12px 0;}
  .barbusca input{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;font-size:15px;}
  .snd.conimg{background-size:cover;background-position:center;}
  .snd.conimg:after{content:"";position:absolute;inset:0;border-radius:18px;
    background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 55%);pointer-events:none;}
  .snd.conimg .emoji{display:none;}
  .snd.conimg .nom{position:relative;z-index:2;text-shadow:0 1px 3px #000;}
  .snd.drag{opacity:.55;transform:scale(1.05);box-shadow:0 14px 28px rgba(0,0,0,.6);}
  main{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
  /* Botón 3D glossy tipo tecla */
  .snd{position:relative;aspect-ratio:1;border-radius:18px;cursor:pointer;border:none;
    background:linear-gradient(145deg,#2a3246,#161b29);
    box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 2px 1px rgba(255,255,255,.18), inset 0 -6px 12px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;
    transition:transform .07s, box-shadow .07s;color:var(--tx);}
  .snd:before{content:"";position:absolute;inset:0;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%);pointer-events:none;}
  .snd:active{transform:translateY(3px) scale(.97);
    box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 2px 1px rgba(255,255,255,.12), inset 0 -3px 8px rgba(0,0,0,.5);}
  .snd.son{outline:3px solid var(--acento);outline-offset:-3px;}
  .snd.musica.son{outline-color:var(--acento2);}
  .snd .emoji{font-size:40px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
  .snd .nom{font-size:13px;font-weight:700;text-align:center;padding:0 8px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .snd .badge{position:absolute;top:7px;right:8px;font-size:10px;font-weight:800;color:var(--acento2);}
  .snd .ed{position:absolute;top:6px;left:8px;font-size:15px;opacity:.85;}
  .vacio{color:var(--tx2);text-align:center;margin-top:40px;font-size:15px;line-height:1.5;}
  /* Modal editor */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:420px;
    max-height:90vh;overflow-y:auto;padding:18px;}
  #modal h3{margin:0 0 12px;font-size:18px;}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--tx2);}
  .f input,.f select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);
    border-radius:9px;padding:10px;font-size:15px;}
  .f.row{flex-direction:row;align-items:center;gap:10px;}
  .f.row input[type=checkbox]{width:20px;height:20px;}
  .dos{display:flex;gap:10px;}
  .dos .f{flex:1;}
  .acc{display:flex;gap:10px;justify-content:space-between;margin-top:6px;}
  .acc .primary{background:var(--acento);border-color:var(--acento);color:#201008;}
  .acc button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:15px;font-weight:700;cursor:pointer;}
  .acc button.del{flex:0 0 auto;background:#3a1620;border-color:#5b2230;color:#ffb4b4;}
  .hint{font-size:11px;color:var(--tx2);}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000a;color:#fff;
    padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;}
  #toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Son<b>Arte</b></div>
    <div class="sp"></div>
    <label class="vol">🔊<input id="vol" type="range" min="0" max="100" value="100"></label>
    <button class="hbtn stop" onclick="pararTodo()">⏹ Detener</button>
    <button class="hbtn edit" id="btnEdit" onclick="toggleEdit()">✏️ Editar</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="edbar" id="edbar">
    <button onclick="exportarBotonera()">⬇ Exportar botonera</button>
    <button onclick="document.getElementById('impFile').click()">⬆ Importar botonera</button>
  </div>
  <input id="impFile" type="file" accept="application/json,.json" style="display:none"
    onchange="if(this.files[0]){ importarBotonera(this.files[0]); this.value=''; }">
  <div class="barbusca"><input id="q" placeholder="🔎 Buscar sonido en todas las páginas…" oninput="render()"></div>
  <main><div class="grid" id="grid"></div></main>
</div>

<!-- Modal editor -->
<div id="modal"><div class="box">
  <h3 id="m_title">Sonido</h3>
  <label class="f">Nombre<input id="m_nom" placeholder="Ej. Jonathan al bat"></label>
  <div class="dos">
    <label class="f">Categoría<input id="m_cat" list="cats" placeholder="Jugadores"></label>
    <label class="f">Ícono (emoji)<input id="m_emoji" placeholder="⚾" maxlength="4"></label>
  </div>
  <datalist id="cats"></datalist>
  <label class="f">Audio (MP3/WAV/M4A)
    <input id="m_file" type="file" accept="audio/*" onchange="cargarArchivo(this)">
    <span class="hint" id="m_file_info">Ningún archivo. (Los botones de ejemplo no necesitan archivo.)</span>
  </label>
  <label class="f">Imagen del botón (opcional)
    <input id="m_img" type="file" accept="image/*" onchange="cargarImagen(this)">
    <span class="hint" id="m_img_info">Sin imagen (se usa el emoji). <a href="#" onclick="quitarImagen();return false;">Quitar imagen</a></span>
  </label>
  <div class="dos">
    <label class="f">Desde (m:ss)<input id="m_desde" placeholder="0:00"></label>
    <label class="f">Hasta (m:ss)<input id="m_hasta" placeholder="vacío = todo"></label>
  </div>
  <label class="f">Fundido (seg)<input id="m_fund" type="number" min="0" step="0.5" value="0"></label>
  <label class="f row"><input id="m_loop" type="checkbox"> Repetir en bucle (loop)</label>
  <label class="f row"><input id="m_mus" type="checkbox"> Es música de fondo (baja sola al disparar efectos)</label>
  <label class="f row"><input id="m_excl" type="checkbox"> Cortar la canción anterior al sonar (walk-up)</label>
  <div style="margin:4px 0 12px"><button class="hbtn" onclick="previa()">▶ Escuchar</button></div>
  <div class="acc">
    <button class="del" onclick="borrarSonido()">🗑</button>
    <button onclick="cerrarModal()">Cerrar</button>
    <button class="primary" onclick="guardarSonido()">Guardar</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
"use strict";
// ================== Estado + almacenamiento (IndexedDB, 100% offline) ==================
var DB=null, estado={ sonidos:[], volumen:1 }, catActiva=null, editando=false, editId=null, archivoTmp=null;

function abrirDB(){
  return new Promise(function(res){
    var r=indexedDB.open("sonarte",1);
    r.onupgradeneeded=function(e){ var db=e.target.result;
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      if(!db.objectStoreNames.contains("audio")) db.createObjectStore("audio"); };
    r.onsuccess=function(e){ DB=e.target.result; res(); };
    r.onerror=function(){ res(); };
  });
}
function dbGet(store,key){ return new Promise(function(res){ try{ var t=DB.transaction(store).objectStore(store).get(key);
  t.onsuccess=function(){res(t.result);}; t.onerror=function(){res(null);}; }catch(e){res(null);} }); }
function dbPut(store,key,val){ return new Promise(function(res){ try{ var t=DB.transaction(store,"readwrite").objectStore(store).put(val,key);
  t.onsuccess=function(){res(true);}; t.onerror=function(){res(false);}; }catch(e){res(false);} }); }
function dbDel(store,key){ return new Promise(function(res){ try{ var t=DB.transaction(store,"readwrite").objectStore(store).delete(key);
  t.onsuccess=function(){res(true);}; t.onerror=function(){res(false);}; }catch(e){res(false);} }); }
function guardarEstado(){ dbPut("meta","estado",estado); }

// ================== Motor de audio (Web Audio API) ==================
var AC=null, master=null, musicBus=null, buffers={}, activos=[], efectos=0, musicaActual=null, exclusivoActual=null;
var imgURLs={}, archivoImgTmp=null, imgBorrar=false, drag=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=estado.volumen; master.connect(AC.destination);
  musicBus=AC.createGain(); musicBus.gain.value=1; musicBus.connect(master);
}
function resume(){ if(AC && AC.state==="suspended") AC.resume(); }

// genera sonidos de ejemplo sin archivos (ruido/tono) para probar al instante
function bufferSintetico(gen){
  var dur = gen==="tambor"?0.5:(gen==="silbato"?0.6:1.1);
  var n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++){ var t=i/AC.sampleRate, env=Math.max(0,1-t/dur);
    if(gen==="silbato"){ d[i]=Math.sin(2*Math.PI*2100*t)*env*0.5; }
    else if(gen==="tambor"){ d[i]=Math.sin(2*Math.PI*90*Math.pow(1-t/dur,2)*6)*env*0.9; }
    else { d[i]=(Math.random()*2-1)*env*0.5; } }  // aplausos ~ ruido con caída
  return buf;
}
async function obtenerBuffer(s){
  if(buffers[s.id]) return buffers[s.id];
  if(s.tipo==="sintetico"){ buffers[s.id]=bufferSintetico(s.gen); return buffers[s.id]; }
  var blob=await dbGet("audio",s.id); if(!blob) return null;
  var arr=await blob.arrayBuffer();
  var buf=await new Promise(function(res,rej){ AC.decodeAudioData(arr, res, rej); });
  buffers[s.id]=buf; return buf;
}
function seg(t){ t=(t||"").toString().trim(); if(!t) return 0;
  if(t.indexOf(":")>=0){ var p=t.split(":"); return (parseInt(p[0])||0)*60+(parseFloat(p[1])||0); } return parseFloat(t)||0; }

async function reproducir(s){
  initAudio(); resume();
  var buf=await obtenerBuffer(s);
  if(!buf){ toast("Ese botón no tiene audio aún"); return; }
  var desde=seg(s.desde), hasta=seg(s.hasta), fund=parseFloat(s.fundido)||0;
  var dur = (hasta>desde) ? (hasta-desde) : undefined;
  var src=AC.createBufferSource(); src.buffer=buf;
  var g=AC.createGain();
  src.connect(g); g.connect(s.esMusica?musicBus:master);
  if(s.loop){ src.loop=true; if(dur){ src.loopStart=desde; src.loopEnd=hasta; } }
  var t0=AC.currentTime, target=1;
  if(fund>0){ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(target, t0+Math.min(fund,0.5)); }
  else g.gain.setValueAtTime(target,t0);
  if(dur && !s.loop && fund>0){ var fin=t0+dur; g.gain.setValueAtTime(target,Math.max(t0,fin-fund));
    g.gain.exponentialRampToValueAtTime(0.0001,fin); }
  if(s.exclusivo){ if(exclusivoActual){ try{exclusivoActual.src.stop();}catch(e){} } exclusivoActual={src:src,g:g}; }
  if(s.esMusica){ if(musicaActual){ try{musicaActual.src.stop();}catch(e){} } musicaActual={src:src,g:g}; }
  else { efectos++; duck(); }
  try{ src.start(0, desde||0, dur); }catch(e){ src.start(0); }
  var rec={src:src,g:g,s:s}; activos.push(rec);
  marcar(s.id,true);
  src.onended=function(){
    activos=activos.filter(function(x){return x!==rec;});
    if(!s.esMusica){ efectos=Math.max(0,efectos-1); if(efectos===0) unduck(); }
    if(musicaActual && musicaActual.src===src) musicaActual=null;
    if(exclusivoActual && exclusivoActual.src===src) exclusivoActual=null;
    marcar(s.id,false);
  };
}
function duck(){ if(!musicBus) return; var t=AC.currentTime;
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value,t);
  musicBus.gain.linearRampToValueAtTime(0.28,t+0.25); }
function unduck(){ if(!musicBus) return; var t=AC.currentTime;
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value,t);
  musicBus.gain.linearRampToValueAtTime(1,t+0.5); }
function pararTodo(){ activos.slice().forEach(function(r){ try{r.src.stop();}catch(e){} });
  activos=[]; efectos=0; musicaActual=null; exclusivoActual=null; if(musicBus){ musicBus.gain.cancelScheduledValues(AC.currentTime); musicBus.gain.value=1; }
  document.querySelectorAll(".snd.son").forEach(function(el){el.classList.remove("son");}); }
function marcar(id,on){ var el=document.querySelector('.snd[data-id="'+id+'"]'); if(el) el.classList.toggle("son",on); }

// ================== UI ==================
function categorias(){ var c=[]; estado.sonidos.forEach(function(s){ if(c.indexOf(s.categoria)<0) c.push(s.categoria); }); return c; }
function render(){
  var cats=categorias(); if(cats.indexOf(catActiva)<0) catActiva=cats[0]||null;
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  // tabs (se ocultan cuando estás buscando)
  var tabs=document.getElementById("tabs"); tabs.innerHTML=""; tabs.style.display=q?"none":"flex";
  cats.forEach(function(c){ var t=document.createElement("div"); t.className="tab"+(c===catActiva?" on":"");
    t.textContent=c; t.onclick=function(){ catActiva=c; render(); }; tabs.appendChild(t); });
  if(editando){ var a=document.createElement("div"); a.className="tab add"; a.textContent="＋ Categoría";
    a.onclick=function(){ var n=prompt("Nombre de la categoría:"); if(n){ catActiva=n.trim(); nuevo(); } }; tabs.appendChild(a); }
  document.getElementById("edbar").style.display = (editando && !q) ? "flex" : "none";
  // grid
  var g=document.getElementById("grid"); g.innerHTML="";
  var lista;
  if(q){ lista=estado.sonidos.filter(function(s){ return ((s.nombre||"")+" "+(s.categoria||"")).toLowerCase().indexOf(q)>=0; }); }
  else { lista=estado.sonidos.filter(function(s){return s.categoria===catActiva;}); }
  if(!lista.length){ g.innerHTML='<div class="vacio">'+(q?"Sin resultados para «"+escapar(q)+"».":"No hay sonidos en esta página.<br>Toca <b>✏️ Editar</b> y luego <b>＋</b> para agregar.")+'</div>'; }
  lista.forEach(function(s){
    var b=document.createElement("button"); b.className="snd"+(s.esMusica?" musica":""); b.dataset.id=s.id;
    if(s.color) b.style.background="linear-gradient(145deg,"+s.color+","+s.color+")";
    var badge = s.esMusica?'<div class="badge">♪ fondo</div>':(s.exclusivo?'<div class="badge">⚾ walk-up</div>':'');
    b.innerHTML='<div class="emoji">'+(s.emoji||"🔊")+'</div><div class="nom">'+escapar(s.nombre)+'</div>'
      +badge+((editando&&!q)?'<div class="ed">✎</div>':'');
    if(s.tieneImg){ b.classList.add("conimg"); ponerImagen(b,s.id); }
    if(editando && !q){ b.addEventListener("pointerdown", function(e){ dragInicio(e,s,b); }); }
    else { b.onclick=function(){ reproducir(s); }; }
    g.appendChild(b);
  });
  if(editando && !q){ var add=document.createElement("button"); add.className="snd"; add.style.opacity=".7";
    add.innerHTML='<div class="emoji">＋</div><div class="nom">Agregar</div>'; add.onclick=nuevo; g.appendChild(add); }
  var dl=document.getElementById("cats"); dl.innerHTML=""; cats.forEach(function(c){ var o=document.createElement("option"); o.value=c; dl.appendChild(o); });
}
async function ponerImagen(el,id){
  try{ if(!imgURLs[id]){ var b=await dbGet("audio","img_"+id); if(!b) return; imgURLs[id]=URL.createObjectURL(b); }
    el.style.backgroundImage="url('"+imgURLs[id]+"')"; }catch(e){}
}
// ---- Arrastrar para reordenar (modo edición) ----
function dragInicio(e,s,el){
  if(!editando) return;
  drag={ id:s.id, el:el, x0:e.clientX, y0:e.clientY, moved:false };
  document.addEventListener("pointermove",dragMueve);
  document.addEventListener("pointerup",dragSuelta);
}
function dragMueve(e){
  if(!drag) return;
  if(!drag.moved){ if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)<10) return;
    drag.moved=true; drag.el.classList.add("drag"); drag.el.style.pointerEvents="none"; }
  var t=document.elementFromPoint(e.clientX,e.clientY); var tb=t&&t.closest?t.closest(".snd"):null;
  if(!tb||tb===drag.el||!tb.dataset.id) return;
  var g=document.getElementById("grid"), r=tb.getBoundingClientRect();
  var despues=(e.clientY>r.top+r.height/2);
  g.insertBefore(drag.el, despues?tb.nextSibling:tb);
}
function dragSuelta(){
  document.removeEventListener("pointermove",dragMueve);
  document.removeEventListener("pointerup",dragSuelta);
  if(!drag) return;
  if(drag.moved){ drag.el.classList.remove("drag"); drag.el.style.pointerEvents=""; ordenDesdeDOM(); }
  else { abrirModal(drag.id); }
  drag=null;
}
function ordenDesdeDOM(){
  var ids=[].map.call(document.querySelectorAll('#grid .snd[data-id]'), function(e){return e.dataset.id;});
  var enPagina=estado.sonidos.filter(function(s){return s.categoria===catActiva;});
  var nuevos=ids.map(function(id){ return enPagina.find(function(s){return s.id===id;}); }).filter(Boolean);
  // reemplaza en su MISMO lugar los sonidos de esta categoría, en el nuevo orden (no mueve las demás páginas)
  var k=0;
  estado.sonidos=estado.sonidos.map(function(s){ return s.categoria===catActiva ? (nuevos[k++]||s) : s; });
  guardarEstado();
}
function escapar(t){ return (t||"").replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function toggleEdit(){ editando=!editando; document.getElementById("btnEdit").classList.toggle("on",editando); render(); }

function nuevo(){ editId=null; archivoTmp=null; archivoImgTmp=null; imgBorrar=false;
  document.getElementById("m_title").textContent="Nuevo sonido";
  set("m_nom",""); set("m_cat",catActiva||""); set("m_emoji","⚾"); set("m_desde",""); set("m_hasta","");
  set("m_fund","0"); chk("m_loop",false); chk("m_mus",false); chk("m_excl",false);
  document.getElementById("m_file_info").textContent="Ningún archivo. (Los botones de ejemplo no necesitan archivo.)";
  document.getElementById("m_img_info").innerHTML='Sin imagen (se usa el emoji).';
  document.getElementById("modal").style.display="flex"; }
function abrirModal(id){ var s=estado.sonidos.find(function(x){return x.id===id;}); if(!s)return;
  editId=id; archivoTmp=null; archivoImgTmp=null; imgBorrar=false;
  document.getElementById("m_title").textContent="Editar sonido";
  set("m_nom",s.nombre); set("m_cat",s.categoria); set("m_emoji",s.emoji||""); set("m_desde",s.desde||""); set("m_hasta",s.hasta||"");
  set("m_fund",s.fundido||0); chk("m_loop",!!s.loop); chk("m_mus",!!s.esMusica); chk("m_excl",!!s.exclusivo);
  document.getElementById("m_file_info").textContent = s.tipo==="sintetico" ? "Sonido de ejemplo (sintetizado)" : "Audio guardado ✓ (sube otro para cambiarlo)";
  document.getElementById("m_img_info").innerHTML = (s.tieneImg?'Imagen guardada ✓. ':'Sin imagen (se usa el emoji). ')+'<a href="#" onclick="quitarImagen();return false;">Quitar imagen</a>';
  document.getElementById("modal").style.display="flex"; }
function cargarImagen(inp){ if(!inp.files[0])return; archivoImgTmp=inp.files[0]; imgBorrar=false;
  document.getElementById("m_img_info").textContent="Imagen lista: "+archivoImgTmp.name; }
function quitarImagen(){ archivoImgTmp=null; imgBorrar=true; document.getElementById("m_img").value="";
  document.getElementById("m_img_info").textContent="Se quitará la imagen al guardar."; }
function cerrarModal(){ document.getElementById("modal").style.display="none"; }
function set(id,v){ document.getElementById(id).value=v; }
function chk(id,v){ document.getElementById(id).checked=v; }
function val(id){ return document.getElementById(id).value; }

async function cargarArchivo(inp){ if(!inp.files[0])return; archivoTmp=inp.files[0];
  document.getElementById("m_file_info").textContent="Listo: "+archivoTmp.name;
  if(!val("m_nom")) set("m_nom", archivoTmp.name.replace(/\.[^.]+$/,"")); }

async function guardarSonido(){
  var nom=val("m_nom").trim(); if(!nom){ toast("Ponle un nombre"); return; }
  var s = editId ? estado.sonidos.find(function(x){return x.id===editId;}) : { id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), tipo:"archivo" };
  s.nombre=nom; s.categoria=(val("m_cat").trim()||"General"); s.emoji=val("m_emoji").trim()||"🔊";
  s.desde=val("m_desde").trim(); s.hasta=val("m_hasta").trim(); s.fundido=parseFloat(val("m_fund"))||0;
  s.loop=document.getElementById("m_loop").checked; s.esMusica=document.getElementById("m_mus").checked;
  s.exclusivo=document.getElementById("m_excl").checked;
  if(archivoTmp){ s.tipo="archivo"; await dbPut("audio",s.id,archivoTmp); delete buffers[s.id]; }
  if(archivoImgTmp){ await dbPut("audio","img_"+s.id,archivoImgTmp); s.tieneImg=true;
    if(imgURLs[s.id]){ try{URL.revokeObjectURL(imgURLs[s.id]);}catch(e){} delete imgURLs[s.id]; } }
  else if(imgBorrar){ await dbDel("audio","img_"+s.id); s.tieneImg=false;
    if(imgURLs[s.id]){ try{URL.revokeObjectURL(imgURLs[s.id]);}catch(e){} delete imgURLs[s.id]; } }
  if(!editId) estado.sonidos.push(s);
  catActiva=s.categoria; guardarEstado(); archivoTmp=null; archivoImgTmp=null; imgBorrar=false; cerrarModal(); render(); toast("Guardado");
}
async function borrarSonido(){ if(!editId){ cerrarModal(); return; }
  if(!confirm("¿Borrar este sonido?")) return;
  estado.sonidos=estado.sonidos.filter(function(x){return x.id!==editId;});
  await dbDel("audio",editId); await dbDel("audio","img_"+editId); delete buffers[editId];
  if(imgURLs[editId]){ try{URL.revokeObjectURL(imgURLs[editId]);}catch(e){} delete imgURLs[editId]; }
  guardarEstado(); cerrarModal(); render(); toast("Borrado"); }
async function previa(){
  var temp={ id:"__previa", tipo: (editId && estado.sonidos.find(function(x){return x.id===editId;}) && estado.sonidos.find(function(x){return x.id===editId;}).tipo) || "archivo",
    gen:null, desde:val("m_desde"), hasta:val("m_hasta"), fundido:parseFloat(val("m_fund"))||0,
    loop:document.getElementById("m_loop").checked, esMusica:document.getElementById("m_mus").checked };
  // usar el audio en edición
  if(archivoTmp){ await dbPut("audio","__previa",archivoTmp); delete buffers["__previa"]; }
  else if(editId){ var s=estado.sonidos.find(function(x){return x.id===editId;});
    if(s.tipo==="sintetico"){ temp.tipo="sintetico"; temp.gen=s.gen; } else { var b=await dbGet("audio",editId); if(b){ await dbPut("audio","__previa",b); delete buffers["__previa"]; } else { toast("Sube un audio"); return; } } }
  else { toast("Sube un audio para escuchar"); return; }
  reproducir(temp);
}

// ================== Exportar / Importar (respaldo y mover de dispositivo) ==================
function blobABase64(blob){ return new Promise(function(res){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.readAsDataURL(blob); }); }
async function exportarBotonera(){
  toast("Preparando respaldo…");
  var datos={ app:"SonArte", version:1, volumen:estado.volumen, sonidos:estado.sonidos, audios:{}, imagenes:{} };
  for(var i=0;i<estado.sonidos.length;i++){ var s=estado.sonidos[i];
    if(s.tipo==="archivo"){ var b=await dbGet("audio",s.id); if(b) datos.audios[s.id]=await blobABase64(b); }
    if(s.tieneImg){ var im=await dbGet("audio","img_"+s.id); if(im) datos.imagenes[s.id]=await blobABase64(im); } }
  var blob=new Blob([JSON.stringify(datos)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="botonera-sonarte.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
  toast("Botonera exportada ✓");
}
async function importarBotonera(file){
  try{
    var d=JSON.parse(await file.text());
    if(!d || !d.sonidos){ toast("Ese archivo no es una botonera"); return; }
    var reemplazar=confirm("¿Reemplazar tu botonera por la del archivo?\n\nAceptar = Reemplazar   ·   Cancelar = Agregar (combinar)");
    var mapId={};
    var nuevos=d.sonidos.map(function(s){ var ns=Object.assign({},s);
      if(!reemplazar){ var nid="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+(Math.random().toString(36).slice(2,4)); mapId[s.id]=nid; ns.id=nid; }
      return ns; });
    var aud=d.audios||{};
    for(var oldId in aud){ var nid = reemplazar ? oldId : (mapId[oldId]||oldId);
      var b=await (await fetch(aud[oldId])).blob(); await dbPut("audio", nid, b); }
    var ims=d.imagenes||{};
    for(var oId in ims){ var nId = reemplazar ? oId : (mapId[oId]||oId);
      var ib=await (await fetch(ims[oId])).blob(); await dbPut("audio", "img_"+nId, ib); }
    if(reemplazar){ estado.sonidos=nuevos; if(d.volumen!=null) estado.volumen=d.volumen;
      document.getElementById("vol").value=Math.round((estado.volumen||1)*100); if(master) master.gain.value=estado.volumen; }
    else { estado.sonidos=estado.sonidos.concat(nuevos); }
    buffers={}; imgURLs={}; catActiva=null; guardarEstado(); render();
    toast(reemplazar?"Botonera importada ✓":"Botonera agregada ✓");
  }catch(e){ toast("No se pudo leer el archivo"); }
}

function toast(t){ var e=document.getElementById("toast"); e.textContent=t; e.classList.add("on");
  clearTimeout(window.__tt); window.__tt=setTimeout(function(){e.classList.remove("on");},1600); }

document.getElementById("vol").addEventListener("input",function(){ estado.volumen=this.value/100;
  if(master) master.gain.value=estado.volumen; guardarEstado(); });

// ================== Arranque ==================
async function arranque(){
  await abrirDB();
  var g=await dbGet("meta","estado");
  if(g && g.sonidos){ estado=g; }
  else {
    // sembrado de ejemplo: una página de Efectos con sonidos sintetizados + una de Jugadores vacía
    estado={ volumen:1, sonidos:[
      {id:"demo1",tipo:"sintetico",gen:"aplausos",nombre:"Aplausos",categoria:"Efectos",emoji:"👏",color:"#2563eb"},
      {id:"demo2",tipo:"sintetico",gen:"silbato",nombre:"Silbato",categoria:"Efectos",emoji:"🎽",color:"#059669"},
      {id:"demo3",tipo:"sintetico",gen:"tambor",nombre:"Tambor",categoria:"Efectos",emoji:"🥁",color:"#b91c1c"}
    ]};
    guardarEstado();
  }
  document.getElementById("vol").value=Math.round((estado.volumen||1)*100);
  render();
  // desbloquear audio en el primer toque (requisito de iOS/Android)
  document.body.addEventListener("pointerdown",function(){ initAudio(); resume(); },{once:true});
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
}
arranque();
